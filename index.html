<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA4vdPsWK1xZoP5-xk6ZsR6SM5ZmsTTQy8",
            authDomain: "amigo-navideno-7cbc3.firebaseapp.com",
            databaseURL: "https://amigo-navideno-7cbc3-default-rtdb.firebaseio.com",
            projectId: "amigo-navideno-7cbc3",
            storageBucket: "amigo-navideno-7cbc3.firebasestorage.app",
            messagingSenderId: "760713435674",
            appId: "1:760713435674:web:f04fd96bf6213a40b84fa3",
            measurementId: "G-X9T0QXT8WG"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const participants = {
            'alber12': 'ALBERTO',
            'yami45': 'YAMILE',
            'dani67': 'DANIEL',
            'oma13': 'OMAIRA',
            'jarvi47': 'JARVI',
            'juli59': 'JULIAN',
            'mar65': 'MARTHA',
            'sebas32': 'SEBASTIAN',
            'adri95': 'ADRIANA',
            'nico05': 'NICOLAS',
        };

        const assignments = {
            'ALBERTO': 'NICOLAS',
            'YAMILE': 'JULIAN',
            'DANIEL': 'OMAIRA',
            'OMAIRA': 'SEBASTIAN',
            'JARVI': 'ADRIANA',
            'JULIAN': 'MARTHA',
            'MARTHA': 'ALBERTO',
            'SEBASTIAN': 'DANIEL',
            'ADRIANA': 'JARVI',
            'NICOLAS': 'YAMILE'
        };

        let currentUser = null;
        let wishlist = ['', '', ''];
        let amigoWishlist = [];
        let showResult = false;

        function getDaysRemaining() {
            const deadline = new Date('2025-12-31T23:59:59');
            const now = new Date();
            const diff = deadline - now;
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        async function loadUserData(userName) {
            try {
                document.getElementById('loading').classList.remove('hidden');
                
                // Cargar mi lista
                const myListSnapshot = await database.ref(`wishlists/${userName}`).once('value');
                const myList = myListSnapshot.val();
                if (myList && Array.isArray(myList)) {
                    wishlist = myList;
                } else {
                    wishlist = ['', '', ''];
                }

                // Cargar lista del amigo secreto
                const amigoSecreto = assignments[userName];
                if (amigoSecreto) {
                    const amigoSnapshot = await database.ref(`wishlists/${amigoSecreto}`).once('value');
                    const amigoList = amigoSnapshot.val();
                    if (amigoList && Array.isArray(amigoList)) {
                        amigoWishlist = amigoList.filter(item => item.trim() !== '');
                    } else {
                        amigoWishlist = [];
                    }
                }

                renderApp();
            } catch (error) {
                console.error('Error cargando datos:', error);
                showError('Error al cargar los datos. Por favor recarga la página.');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function saveWishlist() {
            try {
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = true;
                saveBtn.innerHTML = 'Guardando...';
                
                const validItems = wishlist.filter(item => item.trim() !== '');
                const itemsToSave = validItems.length > 0 ? validItems : [''];
                
                await database.ref(`wishlists/${currentUser}`).set(itemsToSave);
                
                saveBtn.innerHTML = '✓ ¡Guardado exitosamente!';
                saveBtn.classList.remove('bg-gradient-to-r', 'from-purple-500', 'to-pink-500');
                saveBtn.classList.add('bg-green-500');
                
                setTimeout(() => {
                    saveBtn.innerHTML = '💾 Guardar mi lista de deseos';
                    saveBtn.classList.remove('bg-green-500');
                    saveBtn.classList.add('bg-gradient-to-r', 'from-purple-500', 'to-pink-500');
                    saveBtn.disabled = false;
                }, 3000);
            } catch (error) {
                console.error('Error guardando:', error);
                showError('Error al guardar la lista. Por favor intenta de nuevo.');
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 Guardar mi lista de deseos';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 5000);
        }

        function revealAmigo() {
            const code = document.getElementById('accessCode').value.trim().toLowerCase();
            
            if (participants[code]) {
                currentUser = participants[code];
                loadUserData(currentUser);
            } else {
                showError('Código incorrecto. Verifica tu código de acceso.');
            }
        }

        function logout() {
            currentUser = null;
            wishlist = ['', '', ''];
            amigoWishlist = [];
            showResult = false;
            renderApp();
        }

        function addWishItem() {
            if (wishlist.length < 10) {
                wishlist.push('');
                renderApp();
            }
        }

        function removeWishItem(index) {
            if (wishlist.length > 1) {
                wishlist.splice(index, 1);
                renderApp();
            }
        }

        function updateWishItem(index, value) {
            wishlist[index] = value;
        }

        function spinWheel() {
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            const resultDiv = document.getElementById('result');
            
            wheel.style.transform = 'rotate(1440deg)';
            wheel.style.transition = 'transform 3s ease-out';
            spinBtn.disabled = true;
            
            setTimeout(() => {
                wheel.classList.add('hidden');
                spinBtn.classList.add('hidden');
                resultDiv.classList.remove('hidden');
                showResult = true;
            }, 3000);
        }

        function renderApp() {
            const daysRemaining = getDaysRemaining();
            const amigoSecreto = currentUser ? assignments[currentUser] : null;

            document.getElementById('root').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-red-50 via-green-50 to-red-100 p-4 pb-12">
                    <div class="max-w-2xl mx-auto">
                        
                        <div id="loading" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-blue-500 text-white px-6 py-3 rounded-lg shadow-lg z-50">
                            Cargando información...
                        </div>

                        <div id="errorMsg" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 max-w-md text-center">
                        </div>
                        
                        <div class="text-center mb-8 pt-8">
                            <div class="flex justify-center mb-4">
                                <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
                                </svg>
                            </div>
                            <h1 class="text-4xl font-bold text-gray-800 mb-2">Amigo Secreto</h1>
                            <p class="text-gray-600">Intercambio de regalos 2025</p>
                            
                            <div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-red-100 rounded-full">
                                <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span class="font-semibold text-red-600">
                                    ${daysRemaining > 0 ? `${daysRemaining} ${daysRemaining === 1 ? 'día' : 'días'} para el 31 de diciembre` : '¡Hoy es el día!'}
                                </span>
                            </div>
                        </div>

                        ${!currentUser ? `
                            <div class="bg-white rounded-2xl shadow-xl p-8">
                                <div class="flex items-center gap-2 mb-6">
                                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                    <h2 class="text-2xl font-bold text-gray-800">Ingresa tu Código</h2>
                                </div>

                                <p class="text-gray-600 mb-6">
                                    Introduce el código que recibiste para ver quién es tu amigo secreto y compartir tu lista de deseos.
                                </p>

                                <input
                                    type="text"
                                    id="accessCode"
                                    placeholder="Ejemplo: alber12"
                                    class="w-full px-4 py-3 mb-4 border-2 border-gray-200 rounded-lg focus:border-green-500 focus:outline-none font-mono text-center text-lg"
                                />

                                <button
                                    onclick="revealAmigo()"
                                    class="w-full py-4 bg-gradient-to-r from-green-500 to-blue-500 text-white rounded-lg font-semibold hover:from-green-600 hover:to-blue-600 transition text-lg"
                                >
                                    Ver mi amigo secreto
                                </button>

                                <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                    <p class="text-sm text-blue-800">
                                        💡 <strong>Consejo:</strong> Si no tienes tu código, contacta al organizador del intercambio.
                                    </p>
                                </div>
                            </div>
                        ` : `
                            <div class="space-y-6">
                                
                                <div class="bg-white rounded-2xl shadow-xl p-8">
                                    <div class="text-center mb-6">
                                        <h2 class="text-2xl font-bold text-gray-800 mb-2">
                                            ¡Hola, ${currentUser}! 👋
                                        </h2>
                                        <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-700">
                                            Salir
                                        </button>
                                    </div>

                                    <div class="text-center">
                                        <div class="flex justify-center mb-4">
                                            <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
                                            </svg>
                                        </div>
                                        <p class="text-gray-600 mb-4">Tu amigo secreto es:</p>
                                        
                                        <div class="p-6 bg-white rounded-xl border-4 border-red-300 shadow-lg mb-4 flex flex-col items-center">
                                            ${!showResult ? `
                                                <div id="wheel" class="w-48 h-48 rounded-full border-8 border-red-400 flex items-center justify-center text-6xl">
                                                    🎁
                                                </div>
                                                <button id="spinBtn" onclick="spinWheel()" class="mt-6 px-6 py-3 bg-gradient-to-r from-green-500 to-blue-500 text-white font-semibold rounded-lg shadow hover:from-green-600 hover:to-blue-600 transition">
                                                    Girar ruleta
                                                </button>
                                            ` : `
                                                <div id="result" class="p-6 bg-gradient-to-r from-red-100 to-green-100 rounded-xl border-4 border-red-300 shadow-lg text-center">
                                                    <p class="text-xl text-gray-600 mb-2">Tu amigo secreto es:</p>
                                                    <p class="text-4xl font-bold text-gray-800">${amigoSecreto}</p>
                                                </div>
                                            `}
                                        </div>

                                        <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                            <p class="text-sm text-yellow-800">
                                                🤫 ¡Recuerda mantenerlo en secreto! No le cuentes a nadie quién te tocó.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                ${amigoWishlist.length > 0 ? `
                                    <div class="bg-white rounded-2xl shadow-xl p-8">
                                        <div class="flex items-center justify-between mb-6">
                                            <div class="flex items-center gap-2">
                                                <svg class="w-6 h-6 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                                </svg>
                                                <h2 class="text-2xl font-bold text-gray-800">
                                                    Lista de Deseos de ${amigoSecreto}
                                                </h2>
                                            </div>
                                            <button onclick="loadUserData('${currentUser}')" class="p-2 text-gray-500 hover:text-gray-700 transition" title="Recargar lista">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                                </svg>
                                            </button>
                                        </div>

                                        <p class="text-gray-600 mb-6">
                                            Estas son las ideas de regalo que ${amigoSecreto} compartió contigo:
                                        </p>

                                        <div class="space-y-3">
                                            ${amigoWishlist.map((item, index) => `
                                                <div class="flex items-start gap-3 p-4 bg-pink-50 border-2 border-pink-200 rounded-lg">
                                                    <div class="flex items-center justify-center w-8 h-8 bg-pink-500 text-white rounded-full font-bold flex-shrink-0">
                                                        ${index + 1}
                                                    </div>
                                                    <p class="text-gray-800 pt-1">${item}</p>
                                                </div>
                                            `).join('')}
                                        </div>

                                        <div class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                            <p class="text-sm text-green-800">
                                                💡 Usa estas ideas como inspiración para elegir el regalo perfecto.
                                            </p>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="bg-white rounded-2xl shadow-xl p-8">
                                        <div class="flex items-center justify-between mb-4">
                                            <div class="flex items-center gap-2">
                                                <svg class="w-6 h-6 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                                </svg>
                                                <h2 class="text-2xl font-bold text-gray-800">
                                                    Lista de Deseos de ${amigoSecreto}
                                                </h2>
                                            </div>
                                            <button onclick="loadUserData('${currentUser}')" class="p-2 text-gray-500 hover:text-gray-700 transition" title="Recargar lista">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                                </svg>
                                            </button>
                                        </div>
                                        <div class="p-6 bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg text-center">
                                            <p class="text-gray-500">
                                                ${amigoSecreto} aún no ha compartido su lista de deseos.
                                            </p>
                                            <p class="text-sm text-gray-400 mt-2">
                                                Presiona el botón de actualizar ↻ para verificar si ya la compartió
                                            </p>
                                        </div>
                                    </div>
                                `}

                                <div class="bg-white rounded-2xl shadow-xl p-8">
                                    <div class="flex items-center gap-2 mb-6">
                                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                                        </svg>
                                        <h2 class="text-2xl font-bold text-gray-800">Mi Lista de Deseos</h2>
                                    </div>

                                    <p class="text-gray-600 mb-6">
                                        Comparte ideas de regalos que te gustaría recibir. Tu amigo secreto podrá ver esta lista para inspirarse. Recuerda que el presupuesto para el regalo es de $50.000 y ser lo mas detallado posible en cada regalo 😘
                                    </p>

                                    <div class="space-y-3 mb-4">
                                        ${wishlist.map((item, index) => `
                                            <div class="flex gap-2">
                                                <div class="flex items-center justify-center w-8 h-12 text-gray-400 font-semibold">
                                                    ${index + 1}.
                                                </div>
                                                <input
                                                    type="text"
                                                    value="${item}"
                                                    oninput="updateWishItem(${index}, this.value)"
                                                    placeholder="Ej: Libro de cocina, Taza personalizada, etc."
                                                    class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                                                />
                                                ${wishlist.length > 1 ? `
                                                    <button
                                                        onclick="removeWishItem(${index})"
                                                        class="px-4 py-3 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition"
                                                    >
                                                        ✕
                                                    </button>
                                                ` : ''}
                                            </div>
                                        `).join('')}
                                    </div>

                                    ${wishlist.length < 10 ? `
                                        <button
                                            onclick="addWishItem()"
                                            class="w-full py-3 mb-4 border-2 border-dashed border-gray-300 rounded-lg text-gray-600 hover:border-purple-500 hover:text-purple-600 transition"
                                        >
                                            + Agregar otra idea
                                        </button>
                                    ` : ''}

                                    <button
                                        id="saveBtn"
                                        onclick="saveWishlist()"
                                        class="w-full py-4 rounded-lg font-semibold transition bg-gradient-to-r from-purple-500 to-pink-500 text-white hover:from-purple-600 hover:to-pink-600"
                                    >
                                        💾 Guardar mi lista de deseos
                                    </button>

                                    <div class="mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                                        <p class="text-sm text-green-800">
                                            💚 Tu amigo secreto podrá ver esta lista desde cualquier dispositivo para elegir el regalo perfecto para ti.
                                        </p>
                                    </div>
                                </div>

                            </div>
                        `}

                    </div>
                </div>
            `;

            // Agregar listener para Enter en el input del código
            if (!currentUser) {
                const input = document.getElementById('accessCode');
                if (input) {
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') revealAmigo();
                    });
                }
            }
        }

        renderApp();
    </script>
</body>
</html>
